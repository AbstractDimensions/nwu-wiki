<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NWU Wiki — the student-built knowledge base</title>
<meta name="description" content="A community wiki for North-West University students: modules, bursaries, campus life, exams and how-tos. Open for everyone to edit via GitHub.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      colors: {
        "surface-variant": "#353534",
        "on-tertiary": "#4c2700",
        "inverse-surface": "#e5e2e1",
        "surface-dim": "#131313",
        "on-secondary-container": "#c9a8e8",
        "secondary-fixed": "#f0dbff",
        "background": "#131313",
        "on-primary-fixed": "#2c0051",
        "outline-variant": "#4c4453",
        "on-secondary-fixed-variant": "#563a72",
        "primary": "#6b3d8f",
        "surface-bright": "#3a3939",
        "on-tertiary-container": "#e8a163",
        "tertiary-fixed-dim": "#ffb77a",
        "tertiary-fixed": "#ffdcc2",
        "surface-container": "#201f1f",
        "on-tertiary-fixed": "#2e1500",
        "inverse-primary": "#7f38c3",
        "surface": "#131313",
        "primary-container": "#6b3d8f",
        "on-background": "#e5e2e1",
        "outline": "#988d9e",
        "error": "#ffb4ab",
        "on-error-container": "#ffdad6",
        "tertiary-container": "#683700",
        "on-primary-container": "#ffffff",
        "surface-container-lowest": "#0e0e0e",
        "secondary-fixed-dim": "#dbb9fa",
        "surface-container-highest": "#353534",
        "primary-fixed": "#f0dbff",
        "primary-fixed-dim": "#ddb8ff",
        "on-primary-fixed-variant": "#6516a9",
        "on-error": "#690005",
        "secondary": "#dbb9fa",
        "on-surface": "#e5e2e1",
        "surface-container-high": "#2a2a2a",
        "inverse-on-surface": "#313030",
        "secondary-container": "#563a72",
        "on-secondary-container": "#c9a8e8",
        "tertiary": "#ffb77a"
      },
      borderRadius: {
        "none": "0px", "DEFAULT": "0px", "lg": "0px", "xl": "0px", "full": "0px"
      },
      fontFamily: {
        "headline": ["Space Grotesk"],
        "body": ["Inter"],
        "label": ["Space Grotesk"]
      }
    }
  }
}
</script>
<link rel="stylesheet" href="assets/wiki.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.5/dist/purify.min.js"></script>
</head>
<body class="bg-background text-on-surface font-body min-h-screen flex flex-col">

<!-- ===== Top bar ===== -->
<header class="panel-header-tab px-4 py-2 flex items-center gap-3 sticky top-0 z-50">
  <a href="#/home" class="flex items-center gap-2 group">
    <span class="material-symbols-outlined text-on-primary text-xl">menu_book</span>
    <span class="font-headline font-black tracking-widest uppercase text-on-primary text-sm">NWU Wiki</span>
  </a>
  <span class="badge-soon" style="background:#201f1f;color:#ffdcc2;border:1px solid #ffb77a33;">community-built</span>
  <div class="flex-grow"></div>
  <div class="relative w-56 hidden md:block">
    <input id="wikiSearch" type="text" placeholder="Search pages…"
      class="w-full bg-surface-container-lowest border-0 pl-8 pr-2 py-1 font-body text-xs placeholder:text-outline/50 bevel-in focus:ring-0 text-on-surface">
    <span class="material-symbols-outlined absolute left-2 top-1/2 -translate-y-1/2 text-outline text-sm pointer-events-none">search</span>
  </div>
  <a href="https://github.com/AbstractDimensions/nwu-wiki/issues/new/choose" target="_blank" rel="noopener"
     class="bevel-out bg-surface-container-high text-on-surface font-label font-black uppercase text-[9px] px-2 py-1 tracking-widest hover:brightness-125 hidden sm:flex items-center gap-1">
    <span class="material-symbols-outlined text-[12px]">bug_report</span>Report
  </a>
  <a id="editBtn" href="#" target="_blank" rel="noopener"
     class="bevel-out bg-primary text-on-primary font-label font-black uppercase text-[9px] px-2 py-1 tracking-widest hover:brightness-110 flex items-center gap-1">
    <span class="material-symbols-outlined text-[12px]">edit</span>Edit page
  </a>
</header>

<div class="flex flex-grow min-h-0">
  <!-- ===== Sidebar ===== -->
  <aside class="w-64 shrink-0 bg-surface-container bevel-out hidden md:flex flex-col m-2 mr-0">
    <nav id="wikiNav" class="p-3 space-y-1 overflow-y-auto text-sm flex-grow">
      <div class="text-outline text-xs px-2 py-4 font-label uppercase tracking-widest">Loading index…</div>
    </nav>
    <div class="p-3 border-t border-outline-variant/30 space-y-2">
      <a href="https://github.com/AbstractDimensions/nwu-wiki/new/main/pages" target="_blank" rel="noopener"
         class="bevel-out bg-surface-container-highest hover:brightness-125 text-on-surface font-label font-black uppercase text-[9px] px-2 py-2 tracking-widest flex items-center justify-center gap-1 w-full">
        <span class="material-symbols-outlined text-[12px]">add</span>Add a page
      </a>
      <a href="#/contributing"
         class="text-outline hover:text-tertiary text-[10px] font-label uppercase tracking-widest flex items-center gap-1">
        <span class="material-symbols-outlined text-[12px]">help</span>How to contribute
      </a>
    </div>
  </aside>

  <!-- ===== Main content ===== -->
  <main class="flex-grow min-w-0 m-2">
    <!-- Mobile nav -->
    <details class="md:hidden bg-surface-container bevel-out mb-2">
      <summary class="px-4 py-2 font-label font-black uppercase text-[10px] tracking-widest text-on-surface cursor-pointer">Pages</summary>
      <nav id="wikiNavMobile" class="p-3 space-y-1 text-sm border-t border-outline-variant/30"></nav>
    </details>

    <article class="bg-surface-container-lowest bevel-in min-h-[60vh]">
      <div class="panel-header-tab px-4 py-2 flex items-center justify-between">
        <div class="flex items-center gap-2 min-w-0">
          <span class="material-symbols-outlined text-on-primary text-sm" id="pageIcon">article</span>
          <h1 class="font-headline text-xs font-black tracking-widest uppercase text-on-primary truncate" id="pageTitle">Loading…</h1>
        </div>
        <span class="badge-soon shrink-0" id="pageCategory">wiki</span>
      </div>
      <nav class="wiki-tabs" aria-label="Page actions">
        <a id="tabArticle" class="wiki-tab active" href="#/home">Article</a>
        <a id="tabEdit" class="wiki-tab" href="#" target="_blank" rel="noopener">Edit</a>
        <a id="tabHistory" class="wiki-tab" href="#" target="_blank" rel="noopener">History</a>
      </nav>
      <div id="pageBody" class="p-6 md:p-8 max-w-3xl">
        <div class="text-outline text-sm font-label uppercase tracking-widest animate-pulse">Fetching page…</div>
      </div>
      <footer class="px-6 md:px-8 pb-6 text-[10px] text-outline font-label uppercase tracking-widest flex flex-wrap gap-x-4 gap-y-1">
        <span id="pageUpdated">Student-built · not official NWU content</span>
        <span id="pageCats"></span>
        <a class="hover:text-tertiary" href="https://efundihax.github.io" target="_blank" rel="noopener">Powered by eFundiHax ↗</a>
        <a class="hover:text-tertiary" id="historyLink" href="#" target="_blank" rel="noopener">Page history ↗</a>
      </footer>
    </article>
  </main>
</div>

<script src="assets/wiki.js"></script>
</body>
</html>
